name: Hold probe 06 - repository destruction

on:
  push:
    branches:
      - case-06-repository-destruction

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Unreachable destructive repository commands
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/main"
          gh repo delete "$GITHUB_REPOSITORY" --yes
      - name: Emit harmless marker
        run: printf '%s\n' 'HOLD_LAB_CASE=repository-destruction'
